<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Operator!</title>
    <!-- No icon file: an empty one keeps the browser from asking for /favicon.ico (a 404 in the console). -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="TemplateData/style.css">
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
#if DEVELOPMENT_PLAYER
    <script src="<<<TemplateData/profiler.js>>>"></script>
#endif
  </head>
  <body>
    <!-- Operator template (Step 9b): the canvas fills the window and follows its size; no footer, no logo. -->
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <!-- The cover hides the canvas until the game says its first menu frame is drawn (window.operatorGameReady). -->
    <div id="unity-loading-cover">
      <div id="unity-loading-bar">
        <div id="unity-loading-title">Operator!</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="unity-loading-status">&nbsp;</div>
      </div>
    </div>
    <div id="unity-warning"> </div>
#if SHOW_DIAGNOSTICS
    <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png">
#endif
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Unity's error and warning banner, kept so problems are visible on a phone. Errors stay; warnings fade.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
      document.querySelector("#unity-loading-bar").style.display = "block";

      // The cover stays up after createUnityInstance resolves: Unity can still show a frame or two of black before
      // the menu draws. GameReady.jslib calls window.operatorGameReady() once the menu's first frame is on screen;
      // the fallback lifts the cover anyway in case that signal never comes.
      var coverFallbackMs = 8000;
      var cover = document.querySelector("#unity-loading-cover");
      var coverLifted = false;
      function liftCover() {
        if (coverLifted) return;
        coverLifted = true;
        cover.style.pointerEvents = "none";
        cover.style.opacity = "0";
        setTimeout(() => { cover.style.display = "none"; }, 400);
      }
      window.operatorGameReady = liftCover;

      // Unity reports 0-0.9 while downloading and 1 once the player runs, so the bar is full when the download ends.
      function showProgress(progress) {
        document.querySelector("#unity-progress-bar-full").style.width = Math.min(100, 100 * progress / 0.9) + "%";
        if (progress >= 0.9) document.querySelector("#unity-loading-status").textContent = "Starting...";
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, showProgress).then((unityInstance) => {
          showProgress(1);
          setTimeout(liftCover, coverFallbackMs);
#if SHOW_DIAGNOSTICS
          document.getElementById("diagnostics-icon").onclick = () => {
            unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
          };
#endif
        }).catch((message) => {
          unityShowBanner(message, 'error');
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
